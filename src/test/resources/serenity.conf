serenity {
    take.screenshots = AFTER_EACH_STEP
    use.unique.browser = true
    test.root = "co.com.automationexercise.compra"
    console.colors = true
    logging = "VERBOSE"
    timeout = 15000
    report {
        accessibility = true
    }
    requirement {
        types = "epic, feature"
    }
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "disable-popup-blocking",
        "disable-default-apps",
        "disable-extensions-file-access-check",
        "disable-infobars",
        "disable-gpu",
        "remote-allow-origins=*"
      ]
    }
  }
}

chrome {
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "disable-popup-blocking",
        "disable-default-apps",
        "disable-extensions-file-access-check",
        "disable-infobars",
        "disable-gpu",
        "remote-allow-origins=*"
      ]
    }
  }
}

pages {
    homeUrl = "https://automationexercise.com"
}
