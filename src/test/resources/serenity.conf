serenity {
    take.screenshots = AFTER_EACH_STEP
    use.unique.browser = false
    restart.browser.for.each = scenario
    console.colors = true
    logging = "VERBOSE"
    timeout = 20000
    requirements.dir = "src/test/resources/features"
    report {
        accessibility = true
    }
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "disable-popup-blocking",
        "disable-default-apps",
        "disable-extensions-file-access-check",
        "disable-infobars",
        "disable-gpu",
        "disable-search-engine-choice-screen",
        "disable-blink-features=AutomationControlled",
        "remote-allow-origins=*"
      ]
    }
  }
}

chrome {
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "disable-popup-blocking",
        "disable-default-apps",
        "disable-extensions-file-access-check",
        "disable-infobars",
        "disable-gpu",
        "disable-search-engine-choice-screen",
        "disable-blink-features=AutomationControlled",
        "remote-allow-origins=*"
      ]
    }
  }
}

pages {
    homeUrl = "https://automationexercise.com"
}
